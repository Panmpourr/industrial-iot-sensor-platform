services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 50
      start_period: 20s

  # Brings the database schema up to date (sql/migrate.sh), then exits. The backend waits for it.
  migrate:
    image: timescale/timescaledb:latest-pg16
    entrypoint: [ "sh", "/sql/migrate.sh" ]
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER:-iiot_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - ./sql:/sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./Sensor-app/backend-dotnet
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # The backend uses the limited account from sql/app-user.sql, not the database owner
      DB_USER: ${DB_APP_USER:-iiot_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./Sensor-app/frontend
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Optional OPC UA test server (Temperature ns=2;i=2, Humidity ns=2;i=3, Pressure ns=2;i=4).
  # Start it with:  docker compose --profile simulator up -d
  # In the dashboard use endpoint URL:  opc.tcp://opcua-sim:4840
  opcua-sim:
    image: python:3.11-slim
    profiles: [ simulator ]
    command: bash -c "pip install -q --root-user-action=ignore opcua && python -u /scripts/opcua_simulator.py"
    volumes:
      - ./Sensor-app/scripts:/scripts:ro
    restart: unless-stopped

volumes:
  pgdata:
